<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
        body {
            background-color: #f4f6f9;
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 80%;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        p {
            color: #7f8c8d;
            font-size: 18px;
        }
        img {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .heart {
            color: red;
            font-size: 30px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>带土</h1>
        <img src="https://via.placeholder.com/300" alt="我的照片">
        <p>我喜欢你</p>
        <div class="heart">❤️</div>
    </div>
</body>
</html>
