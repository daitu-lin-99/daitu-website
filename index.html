<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
        body {
            background-color: #f4f6f9;
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 80%;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #7f8c8d;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>欢迎来到我的主页！</h1>
        <p>这是我通过手机在 GitHub 上创建的第一个网页。</p>
    </div>
</body>
</html>
